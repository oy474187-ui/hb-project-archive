function initTagCollapsibles(root=document){

  const inner=w.querySelector('.tags-inner'),btn=w.querySelector('.tags-toggle');

  const check=()=>{
   const chips=[...inner.children];if(!chips.length)return;
   const starts=[...new Set(chips.map(c=>c.offsetTop))].sort((a,b)=>a-b);
   if(starts.length>2){
    const third=starts[2];
    const height=Math.max(0,third-starts[0]-parseFloat(getComputedStyle(inner).rowGap||'0'));
    inner.style.setProperty('--tag-two-row',height+'px');w.classList.add('has-overflow');
   }else{w.classList.remove('has-overflow');w.classList.remove('expanded');btn.setAttribute('aria-expanded','false');}
  };
  check();
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(check).observe(inner.parentElement);
  btn.onclick=()=>{const expanded=w.classList.toggle('expanded');btn.setAttribute('aria-expanded',String(expanded));btn.innerHTML=expanded?'접기 <span aria-hidden="true">⌃</span>':'더보기 <span aria-hidden="true">⌄</span>';};
 });

function applyContentOverrides(content){
 if(!content||typeof content!=="object")return;
 for(const p of PROJECTS){const d=content[p.id];if(!d||typeof d!=="object")continue;
  if(typeof d.title==="string"&&d.title.trim())p.title=d.title.trim();p.hidden=d.hidden===true;
  if(d.case&&typeof d.case==="object")Object.assign(CASE_DATA[p.id],d.case);
  if(d.media&&typeof d.media==="object"){
   window.PORTFOLIO_MEDIA=window.PORTFOLIO_MEDIA||{};
   window.PORTFOLIO_MEDIA[p.id]=d.media;
  }
 }
}
function mediaFor(id){return (window.PORTFOLIO_MEDIA||{})[id]||{images:[],links:[]}}
function safeMediaUrl(url){if(typeof url!=="string")return "";let s=url.trim();if(!s||s.startsWith("//")||/^(javascript|data|file):/i.test(s))return "";return /^(https:\/\/|http:\/\/|images\/|\.\/images\/)/i.test(s)?s:""}
function renderCaseImage(label,num,id){let src=safeMediaUrl(mediaFor(id).images?.[num-1]);return src?`<div class="case-gallery-item is-filled"><img loading="lazy" src="${escapeHTML(src)}" alt="${escapeHTML(label)}" onerror="this.parentElement.classList.remove('is-filled');this.parentElement.innerHTML='<strong>이미지를 확인해 주세요</strong>'"><span class="image-label">${escapeHTML(label)}</span></div>`:`<div class="case-gallery-item"><span>IMAGE ${String(num).padStart(2,'0')}</span><strong>${escapeHTML(label)}</strong><small>images/ 폴더에 파일 추가 후 media.js에서 연결</small></div>`}
function renderProjectLinks(id){const links=mediaFor(id).links||[];const valid=links.filter(x=>safeMediaUrl(x.url)&&/^https?:\/\//i.test(x.url));return valid.length?`<nav class="case-external-links" aria-label="프로젝트 링크">${valid.map(x=>`<a href="${escapeHTML(x.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(x.label||'링크 열기')} ↗</a>`).join('')}</nav>`:''}
const PALETTES={G:['#6886A1','#EDF3F9','#DCE7F2']};
const PROJECT_ACCENTS={};
function projectPalette(id){return PALETTES.G}

function showCase(i){
 const d=CASE_DATA[i.id];if(!d)return;const show=k=>d.sections?.[k]!==false;
 const tags=tagsFor(i),group=GROUPS[grouping(i)].label;
 const heroSrc=show('images')&&d.images?.length?safeMediaUrl(mediaFor(i.id).images?.[0]):'';
 const visual=heroSrc?`<div class="case-visual is-filled"><img src="${escapeHTML(heroSrc)}" alt="${escapeHTML(d.images[0])}"/><span class="image-label">${escapeHTML(d.images[0])}</span></div>`:'';
 const palette=projectPalette(i.id);const paletteStyle=`--accent:${palette[0]};--accent-soft:${palette[1]};--accent-mid:${palette[2]}`;
 $('modalRoot').innerHTML=`<div class="modalbg"><div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHTML(i.title)}"><button class="modalclose" id="close" aria-label="닫기">×</button><article class="case case-v7" style="${paletteStyle}"><div class="case-id">${escapeHTML(group)} &nbsp; / &nbsp; PROJECT ${escapeHTML(i.id)}</div><h2>${escapeHTML(d.headline)}</h2><p class="lead">${escapeHTML(d.lead)}</p><div class="case-metadata"><div><b>기간</b><span>${escapeHTML(d.period)}</span></div><div><b>역할</b><span>${escapeHTML(d.role)}</span></div>${d.tools?`<div><b>도구</b><span>${escapeHTML(d.tools)}</span></div>`:''}</div><div class="case-hero" style="${visual?'':'grid-template-columns:1fr'}"><section><div class="case-caption">01 / PROJECT OVERVIEW</div><h3>${escapeHTML(i.title)}</h3>${show('overview')&&d.overview?.trim()?`<p>${escapeHTML(d.overview)}</p>`:''}<div class="case-tags tags-collapsible"><div class="tags-inner">${tags.map(t=>`<span>${escapeHTML(t)}</span>`).join('')}</div><button type="button" class="tags-toggle" aria-expanded="false">더보기 <span aria-hidden="true">⌄</span></button></div></section>${visual}</div>${(show('background')&&d.background?.trim())||(show('overview')&&d.overview?.trim())?`<div class="case-section case-pair">${show('background')&&d.background?.trim()?`<section><div class="case-caption">BACKGROUND</div><h3>프로젝트 배경</h3><p>${escapeHTML(d.background)}</p></section>`:''}${show('overview')&&d.overview?.trim()?`<section class="case-summary"><div class="case-caption">APPROACH</div><h3>개선 방향</h3><p>${escapeHTML(d.overview)}</p></section>`:''}</div>`:''}${show('highlights')&&d.highlights?.length?`<section class="case-section"><div class="case-caption">02 / KEY WORK</div><h3>핵심 작업</h3><div class="case-stepgrid">${d.highlights.map((x,n)=>`<div class="case-step"><em>${String(n+1).padStart(2,'0')}</em><p>${escapeHTML(x)}</p></div>`).join('')}</div></section>`:''}${show('images')&&d.images?.length?`<section class="case-section"><div class="case-caption">03 / OUTPUT</div><h3>주요 결과물</h3><div class="case-gallery">${d.images.map((x,n)=>renderCaseImage(x,n+1,i.id)).join('')}</div>${renderProjectLinks(i.id)}</section>`:renderProjectLinks(i.id)}${show('outcome')&&(d.outcome?.trim()||d.metrics?.length)?`<section class="case-section"><div class="case-caption">04 / RESULT</div><h3>결과 및 의미</h3>${d.metrics.length?`<div class="case-metrics">${d.metrics.map(m=>`<div class="case-metric"><small>${escapeHTML(m[0])}</small><strong>${escapeHTML(m[1])}</strong></div>`).join('')}</div>`:''}${d.outcome?.trim()?`<p>${escapeHTML(d.outcome)}</p>`:''}</section>`:''}${show('related')?`<section class="case-section"><div class="case-caption">RELATED WORK</div><h3>세부 작업</h3><div class="case-partdetails">${i.parts.map(x=>`<span>${escapeHTML(x.title)}</span>`).join('')}</div></section>`:''}</article></div></div>`;
 initTagCollapsibles($('modalRoot'));$('close').onclick=closeCase;
}
function closeCase(){$('modalRoot').innerHTML=''}
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-side]');if(b){navigate({type:b.dataset.side,key:b.dataset.key});return}let el=ev.target.closest('[data-entry]');if(el){let e=children().find(x=>x.id===el.dataset.entry);if(!e)return;if(ev.detail>=2){open(e);return}markSelection(e.id);return}if(ev.target.classList.contains('modalbg'))closeCase()});document.addEventListener('dblclick',ev=>{let el=ev.target.closest('[data-entry]');if(el){let e=children().find(x=>x.id===el.dataset.entry);if(e&&e.type==='doc'&&!$('modalRoot').innerHTML)open(e)}});document.addEventListener('keydown',ev=>{if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='f'){ev.preventDefault();$('search').focus();$('search').select();return}if(ev.key==='Escape'){if($('modalRoot').innerHTML)closeCase();else if($('search')===document.activeElement&&$('search').value){$('search').value='';search='';selected=null;render()}$('sidebar').classList.remove('show')}if(ev.key==='Enter'&&selected&&!$('modalRoot').innerHTML){let e=children().find(x=>x.id===selected);if(e)open(e)}});
$('back').onclick=()=>goHistory(-1);$('forward').onclick=()=>goHistory(1);$('home').onclick=()=>navigate({type:'root'});$('gridmode').onclick=()=>{view='grid';render()};$('listmode').onclick=()=>{view='list';render()};$('search').oninput=e=>{search=e.target.value;selected=null;render()};$('menu').onclick=()=>$('sidebar').classList.toggle('show');$('zoom').oninput=e=>{$('scroll').style.fontSize=(.8+.15*Number(e.target.value))+'rem';$('scroll').style.setProperty('--z',e.target.value)};
(async()=>{try{const res=await fetch('content.json',{cache:'no-store'});if(res.ok)applyContentOverrides(await res.json())}catch(e){/* file:// uses embedded v9 fallback */}render();showToast('프로젝트를 더블클릭하면 자세히 볼 수 있어요',3800)})();

/* v12 · image enlargement with accessible keyboard navigation */
let lightboxItems=[],lightboxIndex=0,lightboxPreviousFocus=null;
function closeImageLightbox(){
 const panel=document.getElementById('caseLightbox');if(!panel)return;
 panel.remove();document.body.style.overflow='';
 if(lightboxPreviousFocus&&lightboxPreviousFocus.isConnected)lightboxPreviousFocus.focus({preventScroll:true});
 lightboxItems=[];lightboxPreviousFocus=null;
}
function updateImageLightbox(){
 const panel=document.getElementById('caseLightbox');if(!panel||!lightboxItems.length)return;
 const item=lightboxItems[lightboxIndex],img=panel.querySelector('.case-lightbox-image');
 img.src=item.src;img.alt=item.alt||'프로젝트 이미지';
 panel.querySelector('.case-lightbox-label').textContent=item.alt||'프로젝트 이미지';
 panel.querySelector('.case-lightbox-index').textContent=(lightboxIndex+1)+' / '+lightboxItems.length;
 const more=lightboxItems.length>1;
 panel.querySelectorAll('.case-lightbox-arrow').forEach(x=>x.hidden=!more);
}
function shiftImageLightbox(amount){
 if(!lightboxItems.length)return;
 lightboxIndex=(lightboxIndex+amount+lightboxItems.length)%lightboxItems.length;
 updateImageLightbox();
}
function openImageLightbox(clicked){
 const images=[...document.querySelectorAll('#modalRoot .case-v7 .case-visual.is-filled img, #modalRoot .case-v7 .case-gallery-item.is-filled img')].filter(img=>img.complete&&img.naturalWidth>0);
 const unique=new Set();lightboxItems=[];
 for(const img of images){if(unique.has(img.currentSrc||img.src))continue;unique.add(img.currentSrc||img.src);lightboxItems.push({src:img.currentSrc||img.src,alt:img.alt});}
 lightboxIndex=lightboxItems.findIndex(x=>x.src===(clicked.currentSrc||clicked.src));
 if(lightboxIndex<0||!lightboxItems.length)return;
 lightboxPreviousFocus=document.activeElement;document.body.style.overflow='hidden';
 const panel=document.createElement('div');panel.id='caseLightbox';panel.className='case-lightbox';
 panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label','이미지 확대 보기');
 panel.innerHTML='<button class="case-lightbox-close" type="button" aria-label="이미지 확대 닫기">×</button><button class="case-lightbox-arrow case-lightbox-prev" type="button" aria-label="이전 이미지">‹</button><div class="case-lightbox-main"><img class="case-lightbox-image" alt=""></div><button class="case-lightbox-arrow case-lightbox-next" type="button" aria-label="다음 이미지">›</button><div class="case-lightbox-meta"><span class="case-lightbox-label"></span><span class="case-lightbox-index"></span></div>';
 document.body.appendChild(panel);updateImageLightbox();panel.querySelector('.case-lightbox-close').focus({preventScroll:true});
 panel.addEventListener('click',e=>{if(e.target===panel||e.target.classList.contains('case-lightbox-main'))closeImageLightbox();});
 panel.querySelector('.case-lightbox-close').onclick=closeImageLightbox;
 panel.querySelector('.case-lightbox-prev').onclick=()=>shiftImageLightbox(-1);
 panel.querySelector('.case-lightbox-next').onclick=()=>shiftImageLightbox(1);
}
document.addEventListener('click',event=>{
 const img=event.target.closest('#modalRoot .case-v7 .case-gallery-item.is-filled img, #modalRoot .case-v7 .case-visual.is-filled img');
 if(img){event.preventDefault();openImageLightbox(img);}
});
document.addEventListener('keydown',event=>{
 if(!document.getElementById('caseLightbox'))return;
 if(event.key==='Escape'){event.preventDefault();closeImageLightbox();}
 else if(event.key==='ArrowLeft'){event.preventDefault();shiftImageLightbox(-1);}
 else if(event.key==='ArrowRight'){event.preventDefault();shiftImageLightbox(1);}
});
</script></body></html>
